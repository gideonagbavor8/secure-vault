version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: securevault-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securevault}
      POSTGRES_DB: ${POSTGRES_DB:-securevaultdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securevault-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-securevault}:${POSTGRES_PASSWORD:-securevault}@postgres:5432/${POSTGRES_DB:-securevaultdb}
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER:-securevault}:${POSTGRES_PASSWORD:-securevault}@postgres:5432/${POSTGRES_DB:-securevaultdb}_test
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkeyforlocaldev123!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supersecretjwtrefreshkeyforlocaldev123!}
      - BCRYPT_COST_FACTOR=${BCRYPT_COST_FACTOR:-12}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securevault-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
